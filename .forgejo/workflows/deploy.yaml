name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: forge.choccobear.tech
  IMAGE: forge.choccobear.tech/choccobear/deedee-bot

jobs:
  build-and-deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Trigger Arcane redeploy
        run: curl -fsS -X POST "${{ secrets.ARCANE_WEBHOOK_URL }}"
