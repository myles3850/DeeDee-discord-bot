name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: forge.choccobear.tech
  IMAGE: forge.choccobear.tech/choccobear/deedee-bot

jobs:
  build-and-deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # git sync only redeploys when compose.yaml changes, so follow it with a
      # project redeploy to pull the new image. these go through the Arcane API
      # rather than webhooks: the sync call blocks until it finishes and the
      # redeploy streams progress until done, so each step only passes once
      # Arcane has actually completed it.
      - name: Sync compose file in Arcane
        run: |
          curl -fsS -X POST \
            -H "X-Api-Key: ${{ secrets.ARCANE_API_KEY }}" \
            "${{ vars.ARCANE_URL }}/api/environments/0/gitops-syncs/${{ vars.ARCANE_SYNC_ID }}/sync"

      - name: Redeploy in Arcane
        run: |
          curl -fsS -N -X POST \
            -H "X-Api-Key: ${{ secrets.ARCANE_API_KEY }}" \
            "${{ vars.ARCANE_URL }}/api/environments/0/projects/${{ vars.ARCANE_PROJECT_ID }}/redeploy" \
            | tee redeploy.log
          grep -q '"done":true' redeploy.log
          ! grep -qi '"error"' redeploy.log
